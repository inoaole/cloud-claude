<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cloud-claude">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <title>cloud-claude</title>
</head>
<body>
  <!-- Unlock screen (shown until authenticated) -->
  <section id="unlock" class="unlock" hidden>
    <div class="unlock-logo">cloud-claude</div>
    <div class="unlock-sub" id="unlockSub">Enter PIN to unlock</div>
    <div class="pin-dots" id="pinDots" aria-label="PIN"></div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key key-alt" data-k="del">⌫</button>
      <button class="key" data-k="0">0</button>
      <button class="key key-alt" data-k="go">→</button>
    </div>
  </section>

  <!-- App shell (shown after unlock) -->
  <main id="app" hidden>
    <header class="topbar">
      <h1 class="large-title">Today</h1>
      <span class="device-chip" id="deviceChip">—</span>
    </header>
    <section class="content" id="content">
      <div class="empty">
        <div class="empty-mark">◌</div>
        <p>Unlocked.</p>
        <p class="muted">Sprint 1 — PIN auth. Activity, growth and terminal land in later sprints.</p>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Primary" hidden>
    <a class="tab on" data-tab="today"><span class="ic"></span>Today</a>
    <a class="tab" data-tab="timeline"><span class="ic"></span>Timeline</a>
    <a class="tab" data-tab="growth"><span class="ic"></span>Growth</a>
    <a class="tab" data-tab="machines"><span class="ic"></span>Machines</a>
    <a class="tab" data-tab="settings"><span class="ic"></span>Settings</a>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
